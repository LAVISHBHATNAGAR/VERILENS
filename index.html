    <!-- Immediate theme restore script to prevent theme flash (Obsidian dark-first with daylight parity) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('verilens_theme');
          var theme = saved || 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
